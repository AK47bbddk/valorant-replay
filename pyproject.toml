[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vreplay"
version = "0.1.0"
description = "VALORANT 前日試合ふり返りページ自動生成"
requires-python = ">=3.10"
dependencies = [
  "requests", "pyyaml", "numpy", "pillow", "beautifulsoup4>=4.12", "lxml>=5.0",
]

[project.optional-dependencies]
# 動画解析用（Colab には torch / opencv が最初から入っている）
video = ["rapidocr_onnxruntime>=1.2", "yt-dlp[default]>=2025.11", "imageio>=2.34"]
# 自宅 PC で動画だけ落とす用（vreplay fetch）
fetch = ["yt-dlp[default]>=2025.11"]

[project.scripts]
vreplay = "vreplay.__main__:main"

[tool.setuptools]
packages = ["vreplay"]

[tool.setuptools.package-data]
vreplay = ["data/*.npz"]
