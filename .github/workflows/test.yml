name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
        timeout-minutes: 8
      - run: pip install -q requests beautifulsoup4 lxml pyyaml numpy opencv-python-headless pillow pytest rapidocr_onnxruntime
      - run: pytest -q
