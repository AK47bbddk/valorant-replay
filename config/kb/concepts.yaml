# プレイブックの「マップのメタ」スライドで使う、考え方の枠組み（Obsidian の Valo-wiki から）。
# page は Valo-wiki のページ名（[[ ]] の中）。プレイブックからリンクする。

rps:
  title: 戦術のじゃんけん構造
  page: 戦術のじゃんけん構造
  # 攻めの手と守りの手の相性。hands.py の「手」には、このどれに当たるか（style）を書ける
  actions:
    - {id: offangle, side: defense, name: オフアングル・定点待ち, beats: dry, loses_to: skill_take,
       note: オペやジャッジ・強いポジションで射線をロック}
    - {id: skill_take, side: attack, name: スキルテイク, beats: offangle, loses_to: skill_counter,
       note: 索敵・フラッシュを入れて安全にエリアを取る}
    - {id: skill_counter, side: defense, name: スキルカウンター, beats: skill_take, loses_to: dry,
       note: 進行を読んでスキルを返して遅らせる}
    - {id: dry, side: attack, name: ドライ進行, beats: skill_counter, loses_to: offangle,
       note: 足音もスキルも出さずに詰める}

choke:
  title: チョークポイントで守る原理（壊す・返す・殺す）
  page: Defense_Fundamentals
  steps:
    - {id: break, name: 壊す, text: 索敵スキル（リコン・ドローン・犬）を壊して、位置と人数を渡さない}
    - {id: return, name: 返す, text: 進行に合わせてモク＋α（モロ・スロウ・壁）を返し、エントリーと後続を分断する}
    - {id: kill, name: 殺す, text: 抜けてきたエントリーのデュエリストにスキルを当て、囲んで倒す}
  attack_answer: 攻めは「フラッシュ＋索敵（リコン系）＋デュエリスト」の形で、壊しに来た相手にフラッシュを合わせ、返しのスキルの外から入る

entry:
  title: サイトエントリーの種類
  page: サイトエントリーの種類
  kinds:
    - {name: セット, text: チョークの手前からスキルで入る。オペがいるときはこれ一択}
    - {name: コンタクトセット, text: ドライで詰め、見られた／サイトが近くなったらスキル。火力がいちばん高い}
    - {name: ドライIN, text: サイトに入り切るまでスキルを使わない。サイトを空けてリテイク狙いの相手に強い}

turn:
  title: ターン（アクションとリアクションの応酬）
  page: ターン
  text: 初動の動き → 相手のリアクション → こちらのリアクション…の連鎖。どのアクションにどのリアクションを返したかを並べて見る

formation:
  title: 1-X の陣形と後衛のトレード
  pages: [1－x構造, 攻撃側エリア取りの基礎]
  points:
    - 人数の多い側（X）が先にアクションを起こし、1 の側はその戦闘が始まってから動く（後出しじゃんけん）
    - 1 の側は絶対に死なない。トレードで削られていいのは 1 人まで
    - 後衛はエントリーが倒された 4 秒以内に倒し返せる位置（トレードの距離）にいる
    - クロスを組む：2 人で別々の角度から同じ場所を見る（片方を見たらもう片方に撃たれる）

value_bluff:
  title: バリューとブラフ
  page: スキルトレード
  points:
    - バリュー：スキルを使って確実にエリア・情報・人数を取る（スキルトレードで相手のスキルを吐かせる）
    - ブラフ：見せた形（スキル・足音・人数）で相手を寄せ、本命は別の場所（フェイク・スプリット）
    - 何度も見せた動きは「前提」になる。前提を作ってから裏をかく

dry:
  title: ドライで進めるところ／スキルが要るところ
  page: ドライ進行のメタ理論
  text: ロング構造・射線の少ない通路はドライで詰めやすい。分岐の多いエリア・ホールドしやすいエリアはスキルが要る。マップごとの areas[].dry に書く
