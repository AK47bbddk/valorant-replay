# サンセットのメタ。エリア割りは青木の Tactival 分解（2026-11-10）に基づく再作成版（ドラフト）。
map: Sunset
summary: 'ミッドが2サイトの接続でもあるマップ。攻めはミッドと A メイン、B はマーケットとメインの挟み。守りは A メイン内側のポジションが肝。※エリア割りは青木の
  Tactival 分解（2026-11-10）に基づく再作成版。現行 sunset.yaml との差分: サイトのエリア化、Mid Top の分離、A Link・A
  Alley の新設。'
entry_callouts:
- A Main
- A Lobby
- B Market
- B Lobby
# チョークポイント（2026-11-10 青木が Tactival 上に赤丸で示した 7 点＋2026-11-11 追加 1 点）。
# [x, y, エリアA, エリアB]：x, y は displayIcon の 0..1（CALLOUT_FIX 補正後の空間）。
# エリアA と エリアB の境目がこの点を通る。A Lobby→A Main は同じエリア（A Main）内の
# チョークなので両側とも A Main（局所分離の検査では対象外）。C10 は B Main|B Site の境で、
# C10 より北の通路（B Main コールアウトの位置）はサイト側（2026-11-11 青木のモデル）。
# そのため entry_callouts から B Main を外す（B Main コールアウトはサイト側の呼び方になった）。
chokes:
- [0.1134, 0.5867, B Main, B Site]      # C10：B の境界（C10 より北の通路はサイト側＝B Site。2026-11-11 青木の決定）
- [0.3846, 0.4585, Mid, B Market]        # Mid → B Market の境
- [0.2441, 0.5116, B Market, B Site]     # B Market → B Site のドア
- [0.4994, 0.3620, Mid, Mid Top]         # Mid → Mid Top（上段）の境
- [0.7657, 0.6295, A Main, A Main]       # A Lobby → A Main の入口（同一エリア内）
- [0.6979, 0.4743, A Main, A Site]       # A Main → A Site の入口
- [0.9180, 0.3450, A Site, A Alley]      # A Elbow の縦帯：A Site と A Alley をここで横に切る（2026-11-11 追加）
- [0.8988, 0.3192, A Alley, A Site]      # A Alley → A Site の裏口
areas:
- name: A Main
  callouts:
  - A Main
  - A Lobby
  vital: true
  choke: true
  dry: false
  eval:
    distance: 近
    take: 中
    branch: なし
    long: あり
    hold: 容易
  note: コーチ指定のバイタル（上限その2）。初動で取るか引くかの判断が A の攻防の起点。Tactival の矩形は Elbow 際までだが、Elbow はサイト側の現行分類を維持
- name: A Site
  callouts:
  - A Site
  - A Elbow
  vital: false
  choke: false
  dry: false
  eval:
    distance: 近
    take: 高
    branch: あり
    long: なし
    hold: 困難
  note: サイト内（Tactival で独立エリア）。Elbow・Alley・Link と接続が多く、設置後の保持はラーク管理が要る
- name: A Link
  callouts:
  - A Link
  vital: false
  choke: false
  dry: false
  eval:
    distance: 近
    take: 中
    branch: なし
    long: なし
    hold: 困難
  note: Mid Top から A サイト裏への接続（Tactival では上段の帯の一部）。サイト側の接続として扱う（2026-11-10 青木の決定で Link
    の一般則が確定）
- name: A Alley
  callouts:
  - A Alley
  vital: false
  choke: false
  dry: false
  eval:
    distance: 近
    take: 低
    branch: なし
    long: なし
    hold: 容易
  note: A サイト裏〜守りスポーン脇の帯（Tactival で独立エリア）。深くはないが、リテイクの通り道として価値がある
- name: Mid Top
  callouts:
  - Mid Top
  vital: false
  choke: false
  dry: false
  eval:
    distance: 遠
    take: 中
    branch: あり
    long: なし
    hold: 困難
  note: Tactival で Mid から分離。A Link と Market の両方に分岐する上段。取る側がローテーションの選択肢を持つ
- name: Mid
  callouts:
  - Mid Tiles
  - Mid Courtyard
  - Mid Bottom
  vital: true
  choke: false
  dry: true
  eval:
    distance: 遠
    take: 高
    branch: あり
    long: あり
    hold: 困難
  note: コーチ指定のバイタル。Mid 全体はコーチ指定どおりバイタルとし、Top 分離後も本エリア側が指定対象。タイル〜コートヤードの面の取り合いが中心
- name: B Market
  callouts:
  - B Market
  vital: false
  choke: true
  dry: false
  eval:
    distance: 近
    take: 中
    branch: なし
    long: なし
    hold: 困難
  note: B 攻めの片翼。ドアの開閉管理と、Mid からの圧と合わせた挟みが本体。市場内は保持しづらい。Boba はサイト側へ移した（青木の決定）
  card: true
- name: B Site
  callouts:
  - B Site
  - B Boba
  - B Main
  vital: false
  choke: false
  dry: false
  eval:
    distance: 近
    take: 高
    branch: あり
    long: なし
    hold: 容易
  note: サイト内。Boba はサイト側で固定（2026-11-10 青木の決定。線の引き方の問題として扱い、チョーク検査では例外登録済み）。B Main コールアウトは C10 より北（サイト側）なのでここに入れる（2026-11-11 青木のモデル）
- name: B Main
  callouts:
  - B Lobby
  vital: false
  choke: true
  dry: true
  eval:
    distance: 近
    take: 低
    branch: なし
    long: あり
    hold: 容易
  note: C10 より手前（B Lobby 側）の通路。C10 は B Main と B Site の境（2026-11-11 青木の決定）。B 攻めの正面で、取りやすいが単独では浅く、Market との挟みで真価
  card: true

hands:
  defense:
    - name: A3 スキル返し
      style: skill_counter
      when: {zone_min: {A: 3}}
      detail: A に 3 人寄せて、A メインに来たスキル・人にスキルを返す配置
      beats: [A メインラッシュ]
      loses_to: [B スプリット（トップ・マーケット）]
    - name: MID プッシュ（MID＋A で挟む）
      style: skill_counter
      when: {push: Mid}
      detail: MID トップ・コートヤードへ前に出て、A に来た攻めを MID と A で挟む
      beats: [B スプリット（トップ・マーケット）, トップ→A サンドイッチ]
      loses_to: [A メインラッシュ]
    - name: B プッシュ
      style: skill_counter
      when: {push: B}
      detail: マーケット・B メインへ前に出て、B を割りに来る攻めを先に止める
      beats: [B スプリット（トップ・マーケット）]
      loses_to: [A メインラッシュ, トップ→A サンドイッチ]
    - name: A1 配置（スキルで人数を減らす）
      style: offangle
      when: {zone_max: {A: 1}}
      detail: A はスキル（罠・壁）と 1 人で遅らせ、人数を B・MID に回す
      beats: [B スプリット（トップ・マーケット）]
      loses_to: [A メインラッシュ]
    - name: 平たく守る
      style: offangle
      when: {flat: true}
      detail: A・MID・B に散って情報を取り、来た方へ寄る
      beats: []
      loses_to: []

  attack:
    - name: トップ→A サンドイッチ
      style: skill_take
      when: {site: A, via_all: [[Mid Top, Mid Courtyard, Mid Tiles], [A Main, A Lobby, A Elbow]]}
      detail: MID トップ（コートヤード）と A メインの 2 方向から A を挟む
      beats: [A3 スキル返し]
      loses_to: [MID プッシュ（MID＋A で挟む）]
    - name: A メインラッシュ
      style: skill_take
      when: {site: A, commit_by: 35}
      detail: A メインに人数とスキルを集めて速く入る（セットのラッシュ）
      how: [フラッシュ＋索敵で A メインのチョークを抜ける, エントリーが入ったら後衛は 4 秒以内にトレードできる距離を保つ]
      beats: [A1 配置（スキルで人数を減らす）, MID プッシュ（MID＋A で挟む）]
      loses_to: [A3 スキル返し]
    - name: B スプリット（トップ・マーケット）
      style: skill_take
      when: {site: B, via_all: [[B Main, B Lobby]], via_min: {areas: [Mid Top, B Market, B Boba, Mid Courtyard], n: 2}}
      detail: MID トップ・マーケットと B メインの 2 方向から B を割る（トップ壁＋マーケット → タピオカ）。マーケット側に 2 人以上
      beats: [A3 スキル返し]
      loses_to: [MID プッシュ（MID＋A で挟む）, B プッシュ]
    - name: B メインセット
      style: skill_take
      when: {site: B}
      detail: B メインから人数をそろえて 1 方向で入るセット（5-0。マーケット側は 1 人まで）
      beats: []
      loses_to: []
    - name: A デフォルト→A
      style: dry
      when: {site: A, commit_after: 45}
      detail: 散って情報を取ってから A に寄る
      beats: []
      loses_to: []

# じゃんけんの回り方の例（コーチのメモ）。プレイブックに「よくある読み合いの流れ」として出す
cycles:
  - [A3 スキル返し, B スプリット（トップ・マーケット）, A1 配置（スキルで人数を減らす）, A メインラッシュ]
