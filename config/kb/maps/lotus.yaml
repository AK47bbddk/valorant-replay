# ドラフト（2026-11-10、Muse 作成・GLM レビューと青木の決定を反映済み）。エリアと評価のみ。手（hands）は未収録。
map: Lotus
summary: サイト3つのマップ。回転ドアと破壊可能な壁でエリアの接続が変わる。A はラブル（瓦礫）のコントロール、B はメイン1本、C はロング気味の正面が軸。
entry_callouts:
- A Lobby
- A Main
- A Root
- A Rubble
- B Main
- B Pillars
- C Lobby
- C Main
- C Bend
