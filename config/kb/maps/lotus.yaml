  - A Main
  - A Root
  - A Rubble
  vital: false
  choke: true
  dry: false
  eval:
    distance: 近
    take: 中
    branch: あり
    long: あり
    hold: 困難
  note: Rubble の奪い合いが A の起点。取る側が A リンクとサイトの両方に圧をかけられる
