    take: 低
    branch: あり
    long: なし
    hold: 困難
  note: 最速なら取りやすいが、窓をスモークで塞がれると広い道になる。B サイトへの入口でもある
- name: B Site
  callouts:
  - B Site
  - B Back
  vital: false
  choke: false
  dry: false
  eval:
    distance: 近
    take: 高
    branch: あり
    long: なし
    hold: 容易
  note: サイトと思わずミッドコントロールの延長と見るのが定石。侵入口は3つで取り返しはされやすいが、取り返し自体も楽
- name: C Garage
  callouts:
  - C Garage
  - C Window
  vital: false
  choke: true
  dry: false
  eval:
    distance: 近
    take: 低
    branch: なし
    long: なし
