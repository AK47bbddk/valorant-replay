# ドラフト（2026-11-10、Muse 作成・GLM レビューと青木の決定を反映済み）。エリアと評価のみ。手（hands）は未収録。
map: Haven
summary: サイトが3つのマップ。A は孤立し、B と C は連結している。守りの寄りが早く、攻めはエリア確保そのものより1pickと情報で人数差を作るマップ。
entry_callouts:
- A Lobby
- A Long
- A Garden
- A Sewer
- C Garage
- C Window
- C Lobby
- C Long
areas:
- name: A Long
  callouts:
  - A Lobby
  - A Long
  vital: false
  choke: true
  dry: false
  eval:
    distance: 近
    take: 中
    branch: なし
    long: あり
    hold: 容易
  note: 情報取りのエリア。確保しきらなくても「通った可能性」を与えることで守りを A2 に固定する仕事がある
- name: A Short
  callouts:
  - A Garden
  - A Sewer
  vital: false
  choke: true
  dry: false
  eval:
    distance: 近
    take: 中
    branch: あり
    long: なし
    hold: 困難
  note: ガーデン〜下水の入口。高低差があり、ロングと対で A の圧を作る
- name: A Site
  callouts:
  - A Site
  - A Tower
  - A Link
  vital: false
  choke: false
  dry: false
  eval:
    distance: 近
    take: 高
    branch: あり
    long: なし
    hold: 困難
  note: サイト内。他エリアと直結せず、A攻めはここで完結する
- name: Mid
  callouts:
  - Mid Doors
  - Mid Courtyard
  - Mid Window
  vital: false
  choke: false
  dry: true
