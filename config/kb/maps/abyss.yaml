# ドラフト（2026-11-10、Muse 作成・GLM レビューと青木の決定を反映済み）。エリアと評価のみ。手（hands）は未収録。
map: Abyss
summary: 落下のあるマップ。ミッドの高低とブリッジが特徴で、サイトはどちらも接続が多い。エリアの保持より、取るタイミングと人数の掛け方が効く。
