- A Lobby
- A Main
- B Lobby
- B Main
areas:
- name: A Main
  callouts:
  - A Lobby
  - A Main
  vital: false
  choke: true
  dry: false
  eval:
    distance: 近
    take: 中
    branch: なし
    long: あり
    hold: 容易
  note: A の正面入口。一本道気味で、取る判断が早い
- name: A Site
