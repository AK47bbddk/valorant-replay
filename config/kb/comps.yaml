# 構成ごとのメモ（プレイブックの「この構成の特徴」に出す）。must の全員がいる構成に当てはまる。
# maps を書くとそのマップだけ。数字（データ）は vreplay.comp が別に出すので、ここには「人が考えたこと」を書く。
#   attack / defense … 攻め・守りの強み（strong）と弱み（weak）
#   plan            … 攻めの組み立ての主軸（1〜2 文）
#   meta            … 今のメタにどう刺さるか
#   anti            … この構成が苦手な相手（アンチピック）と、そのときの工夫
#   archetype_vs    … 相手の型（vreplay.comp.archetypes の名前）ごとのメモ
comps:
  - name: セージ・チェンバー構成
    must: [Sage, Chamber]
    maps: [Sunset]
    attack:
      strong:
        - チェンバーのドライが強い → 相手の動きに後出しじゃんけんができる
        - セージを使ったポストプラントが強い（壁・スロウで解除を遅らせる）
        - モクをコントロールに使い、モク 1 つだけでセットできる
        - トップを使ったスプリットがしやすい（トップ壁＋マーケット → タピオカ）
      weak:
        - チェンバーのドライに頼っている → 補助（索敵・先にスキルを吐かせる）が要る
        - フラッシュが無いので、チョークポイントを抜けるのが難しい
    defense:
      strong:
        - チェンバーの理不尽な 1 ピック
        - セージのアンチラッシュ性能（壁・スロウ）
        - 各キャラが 1 ディレイずつ持てる
      weak:
        - 索敵が少ないと、ドライで詰められたときに情報が遅れる
    plan: 攻撃はチェンバーのドライで A メイン＋MID を絡めた B スプリットを主軸に組み立てる
    meta: ネオン・フェニックスの 2 デュエのラッシュにはセージの壁・スロウとチェンバーの 1 ピックで強い
    anti:
      - who: KAY/O 込みの 2 イニシエーター構成
        why: ナイフでチェンバーの TP・トラップとセージの壁を封じられ、索敵でドライの位置も割られる
        fix: 工夫が必要（ナイフを見てから下がる・TP を置き直す・索敵を壊す役を決める）

  - name: 2 デュエ（ネオン・フェニックス）
    must: [Neon, Phoenix]
    attack:
      strong: [速いエントリーで人数差を作る, フェニックスのフラッシュを自分で投げてそのまま入れる]
      weak: [遅延スキル（セージ・ヴァイス・デッドロック）を返されると止まる]
    defense:
      strong: [前に出て 1 ピックを取りに行ける]
      weak: [サイトを長く守るスキルが少ない]
    anti:
      - who: セージ・ヴァイスなどのアンチラッシュ持ち＋ULT の多いセンチネル構成
        why: 入る瞬間に壁・スロウで分断される
        fix: 1 巡目はスキルトレードで遅延スキルを吐かせてから入る
