# 既定設定。上書きしたい項目だけを Drive の config.yaml に書けばマージされる。

timezone: Asia/Tokyo

filters:
  # 大会名に含まれる語（大文字小文字は無視）。空なら全大会。
  event_include: ["VCT", "Masters", "Champions"]
  event_exclude: []
  # 空でなければ、このどれかのチームが出ている試合だけ
  teams: []
  # 1回の実行で処理する最大試合数（動画解析の重さ対策）
  max_matches: 8
  # VOD が無い試合も VLR データだけで Notion に書くか
  include_without_vod: true

video:
  max_height: 1080
  fps: 2
  minimap_every: 1.0     # ミニマップ保存の秒間隔（0で毎フレーム）
  panel_every: 1.0       # プレイヤーパネル保存の秒間隔（0で毎フレーム）
  killfeed_on_change: true  # キルフィードは見た目が変わったフレームだけ保存
  per_round_sec: 140     # 次マップの開始秒が分からないときの見積もり
  tail_buffer_sec: 900
  cookies: ""            # cookies.txt のパス。空なら 環境変数 YT_COOKIES → <output.dir>/cookies.txt の順に探す
  cache_dir: ""          # 事前に落とした動画の置き場所。空なら <output.dir>/videos（自宅 PC の vreplay fetch の保存先）
  keep_video: false
  workers: 0             # 解析の並列プロセス数。0 なら CPU 数
  # 解析のしかた
  #   auto   … キーフレーム間隔が fast_keyframe_interval 秒以下なら fast、max_keyframe_interval 秒以下なら rounds、それ以外は full
  #   fast   … キーフレーム（YouTube はおおむね 2 秒ごと）だけで全体を読み、装備表が出る開始前後だけ 2fps で読む（いちばん速い）
  #   rounds … キーフレームでラウンドを探し、ラウンドの区間（開始 9 秒前〜終了）を 2fps で読む（GIF がなめらか）
  #   full   … 全区間を 2fps で読む（いちばん遅い）
  scan_mode: auto
  fast_keyframe_interval: 2.5
  max_keyframe_interval: 6
  download_workers: 3    # 同時にダウンロードするマップ数（解析中に次のマップを先に取得する）
  download_fragments: 4  # 1 本の動画を yt-dlp が分割して並列取得する数（回線が速いなら 8 などに）

hud:
  # タイマー・スコア・ラウンド表記の位置は放送ごとのプリセット（vreplay/layout.py）から自動で選ぶ。
  # プレイヤーカードは ULT アイコンの丸を検出して自動で決める。キルフィードも選手名から自動検出する。
  # 下の roi は自動検出できなかったときの既定値（画面に対する比率 [x0, y0, x1, y1]）
  roi:
    minimap:     [0.000, 0.020, 0.225, 0.400]
    killfeed:    [0.749, 0.081, 0.995, 0.325]
    table:       [0.000, 0.520, 1.000, 1.000]   # 購入フェーズの装備表を探す範囲（画面下部）
  buy_phase_max_sec: 30
  round_timer_sec: 100

warehouse:
  # 空なら output.dir/warehouse.sqlite3。大量の試合メタデータと解析結果を 1 つにまとめる。
  path: ""

tactics:
  # ミニマップの点を拾う間隔（秒）。小さいほど細かいが、動画のデコードが増える。
  sample_seconds: 6
  # ラウンド開始から何秒を「スポーンにいる」とみなして、向き・チーム色の補正に使うか
  spawn_window_seconds: 8
  # サイト集計を始めるまで（開始から何秒後以降の点を使うか）
  site_after_seconds: 20
  min_dot_area: 4
  max_dot_area: 450

output:
  dir: /content/drive/MyDrive/valorant-replay
  gif_width: 320
  gif_speed: 4
  gif_max_frames: 260
  html_report: true

notion:
  enabled: true
  match_data_source: e70c4f36-8160-4ce0-a35b-dfe52f0f7e16
  map_data_source: 3baf8426-8608-49dd-beb6-f8e894447f57
